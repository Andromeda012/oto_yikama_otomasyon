services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: car_wash
      MYSQL_USER: carwash
      MYSQL_PASSWORD: carwash_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      SECRET_KEY: change-me
      DATABASE_URL: mysql+pymysql://carwash:carwash_password@mysql:3306/car_wash
      CORS_ORIGINS: "*"
    depends_on:
      - mysql

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
